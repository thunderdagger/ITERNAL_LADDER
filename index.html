<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal v2.0.0</title>
    <style>
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; justify-content: space-between; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 950px; margin: 20px auto; gap: 15px; }
        
        .sidebar { width: 150px; flex-shrink: 0; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; padding: 5px; }
        .side-header { background-color: #eceff5; padding: 3px 5px; color: #3b5998; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 3px 5px; cursor: pointer; }
        .nav-link.active { background-color: #3b5998; color: white; }

        /* MASTER WRAPPER */
        #master-player-wrapper { position: relative; background: #000; flex-grow: 1; overflow: hidden; border: 1px solid #d8dfea; line-height: 0; cursor: default; }
        
        /* FULLSCREEN STATE STYLES */
        #master-player-wrapper:fullscreen { border: none; width: 100vw; height: 100vh; }
        #master-player-wrapper:fullscreen .video-engine { max-width: 100%; height: 100%; border: none; }
        
        /* Only hide cursor in fullscreen AND when hide-ui class is present */
        #master-player-wrapper:fullscreen.hide-ui { cursor: none; }

        .video-engine { position: relative; width: 100%; max-width: 854px; aspect-ratio: 16/9; overflow: hidden; background: #000; margin: 0 auto; z-index: 1; }
        #player { position: absolute; top: -55px; left: 0; width: 100%; height: calc(100% + 110px); pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 80%; z-index: 2; }

        /* FLOATING UI */
        .floating-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(236, 239, 245, 0.95);
            border-top: 1px solid #3b5998;
            padding: 10px;
            z-index: 10;
            transform: translateY(0);
            transition: transform 0.4s ease, opacity 0.4s ease;
            line-height: normal;
            opacity: 1;
        }

        /* ONLY HIDE IF FULLSCREEN AND IDLE */
        #master-player-wrapper:fullscreen.hide-ui .floating-ui {
            transform: translateY(100%);
            opacity: 0;
        }

        .timeline-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .timeline-container { flex-grow: 1; background: #ddd; height: 10px; cursor: pointer; border: 1px solid #999; position: relative; }
        .progress-bar { background: #3b5998; height: 100%; width: 0%; transition: width 0.1s linear; }
        #time-display { font-family: monospace; color: #333; font-size: 11px; min-width: 120px; text-align: right; }

        .custom-controls { display: flex; align-items: center; gap: 15px; }
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 4px 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
        select, input { font-size: 11px; border: 1px solid #bdc7d8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>thephysicsportal <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">v2.0.0</span></h1>
        <div style="font-size: 11px;">home | search | browse</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="side-box">
                <div class="side-header">Physics Units</div>
                <div class="nav-link active" onclick="loadNewVideo('6tLJsEfbVcY', this)">Test Lesson</div>
                <div class="nav-link" onclick="loadNewVideo('GzY_iOnP3E8', this)">Lesson 1.1</div>
            </div>
        </div>

        <div id="master-player-wrapper">
            <div class="video-engine">
                <div id="player"></div>
                <div class="shield" oncontextmenu="false;"></div>
            </div>

            <div class="floating-ui" id="controls-bar">
                <div class="timeline-wrapper">
                    <div class="timeline-container" id="timeline" onclick="seek(event)">
                        <div class="progress-bar" id="progress"></div>
                    </div>
                    <div id="time-display">00:00:00 / 00:00:00</div>
                </div>

                <div class="custom-controls">
                    <button class="fb-button" onclick="playPause()">PLAY / PAUSE</button>
                    <span>SPD: 
                        <select onchange="setSpeed(this.value)">
                            <option value="1">1x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </span>
                    <span>VOL: <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)" style="width:70px;"></span>
                    <button class="fb-button" onclick="goFullscreen()" style="margin-left:auto;">FULL SCREEN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var progressInterval;
        var idleTimer;
        const wrapper = document.getElementById('master-player-wrapper');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '6tLJsEfbVcY',
                playerVars: { 'controls': 1, 'modestbranding': 1, 'rel': 0, 'vq': 'small' },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        // --- ENHANCED AUTO-HIDE LOGIC ---
        function resetIdleTimer() {
            // Check if we are actually in Fullscreen mode
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            wrapper.classList.remove('hide-ui');
            clearTimeout(idleTimer);

            // Only start the 3s countdown if the user is in Fullscreen
            if (isFullscreen) {
                idleTimer = setTimeout(() => {
                    // Only hide if the video is actually playing
                    if (player.getPlayerState() === 1) {
                        wrapper.classList.add('hide-ui');
                    }
                }, 3000);
            }
        }

        wrapper.addEventListener('mousemove', resetIdleTimer);
        wrapper.addEventListener('click', resetIdleTimer);

        function onPlayerStateChange(event) {
            if (event.data == 1) {
                progressInterval = setInterval(updateUI, 500);
                resetIdleTimer();
            } else {
                clearInterval(progressInterval);
                wrapper.classList.remove('hide-ui'); 
                clearTimeout(idleTimer);
            }
        }

        function formatTime(time) {
            var hours = Math.floor(time / 3600);
            var mins = Math.floor((time % 3600) / 60);
            var secs = Math.floor(time % 60);
            return (hours < 10 ? '0' + hours : hours) + ":" + 
                   (mins < 10 ? '0' + mins : mins) + ":" + 
                   (secs < 10 ? '0' + secs : secs);
        }

        function updateUI() {
            var curr = player.getCurrentTime();
            var dur = player.getDuration();
            if (dur > 0) {
                var perc = (curr / dur) * 100;
                document.getElementById('progress').style.width = perc + "%";
                document.getElementById('time-display').innerText = formatTime(curr) + " / " + formatTime(dur);
            }
        }

        function seek(e) {
            var rect = document.getElementById('timeline').getBoundingClientRect();
            player.seekTo(player.getDuration() * ((e.clientX - rect.left) / rect.width), true);
        }

        function playPause() { (player.getPlayerState() == 1) ? player.pauseVideo() : player.playVideo(); }
        function setSpeed(v) { player.setPlaybackRate(parseFloat(v)); }
        function setVolume(v) { player.setVolume(v); }

        function goFullscreen() {
            var el = document.getElementById('master-player-wrapper');
            if (el.requestFullscreen) { el.requestFullscreen(); }
            else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        }

        function loadNewVideo(id, el) {
            player.loadVideoById(id);
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
