<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal | Early Facebook Edition</title>
    <style>
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; gap: 10px; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 950px; margin: 20px auto; gap: 15px; }
        
        /* Sidebar */
        .sidebar { width: 150px; flex-shrink: 0; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; padding: 5px; }
        .side-header { background-color: #eceff5; padding: 3px 5px; color: #3b5998; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 3px 5px; cursor: pointer; }
        .nav-link:hover { background-color: #eceff5; text-decoration: underline; }
        .nav-link.active { background-color: #3b5998; color: white; text-decoration: none; }

        /* Main Content */
        .main-content { flex-grow: 1; background: white; border: 1px solid #d8dfea; padding: 15px; }
        .content-header { border-bottom: 1px solid #d8dfea; padding-bottom: 5px; margin-bottom: 15px; color: #3b5998; font-size: 14px; font-weight: bold; }

        /* THE PLAYER ENGINE (Hidden URL) */
        .video-engine { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; border: 1px solid #3b5998; }
        #player { position: absolute; top: -60px; left: 0; width: 100%; height: calc(100% + 120px); pointer-events: none; }

        /* CUSTOM FACEBOOK BUTTON BAR */
        .custom-controls { margin-top: 10px; background: #eceff5; border: 1px solid #d8dfea; padding: 10px; display: flex; align-items: center; gap: 15px; }
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 3px 10px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .fb-button:hover { background: #4c70ba; }
        select { font-size: 11px; border: 1px solid #bdc7d8; }
    </style>
</head>
<body>

    <div class="header"><h1>thephysicsportal</h1></div>

    <div class="container">
        <div class="sidebar">
            <div class="side-box">
                <div class="side-header">Physics Units</div>
                <div class="nav-link active" onclick="loadNewVideo('6tLJsEfbVcY', this)">Test Lesson</div>
                <div class="nav-link" onclick="loadNewVideo('GzY_iOnP3E8', this)">Lesson 1.1</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header" id="current-title">Test Lesson</div>
            
            <div class="video-engine">
                <div id="player"></div>
            </div>

            <div class="custom-controls">
                <button class="fb-button" onclick="playPause()">PLAY / PAUSE</button>
                
                <div>
                    SPEED: 
                    <select id="speed" onchange="setSpeed(this.value)">
                        <option value="1">1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                </div>

                <div style="margin-left: auto;">
                    <button class="fb-button" onclick="goFullscreen()">FULLSCREEN</button>
                </div>
            </div>
            
            <p style="color: #777; margin-top: 15px;">Note: Resolution is auto-set to highest available based on your screen.</p>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '6tLJsEfbVcY',
                playerVars: { 'controls': 0, 'modestbranding': 1, 'rel': 0, 'showinfo': 0 }
            });
        }

        // THE HANDSHAKE FUNCTIONS
        function playPause() {
            const state = player.getPlayerState();
            if (state == 1) { player.pauseVideo(); } else { player.playVideo(); }
        }

        function setSpeed(val) {
            player.setPlaybackRate(parseFloat(val));
        }

        function goFullscreen() {
            const requestMethod = document.body.requestFullScreen || document.body.webkitRequestFullScreen || document.body.mozRequestFullScreen || document.body.msRequestFullScreen;
            if (requestMethod) { requestMethod.call(document.body); }
        }

        function loadNewVideo(id, el) {
            player.loadVideoById(id);
            document.getElementById('current-title').innerText = el.innerText;
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
