<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal | physics tutoring</title>
    <style>
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; gap: 10px; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 950px; margin: 20px auto; gap: 15px; }
        .sidebar { width: 150px; flex-shrink: 0; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; padding: 5px; }
        .side-header { background-color: #eceff5; padding: 3px 5px; color: #3b5998; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 2px 5px; margin-bottom: 1px; cursor: pointer; }
        .nav-link:hover { background-color: #eceff5; text-decoration: underline; }
        .nav-link.active { background-color: #3b5998; color: white; text-decoration: none; }
        .main-content { flex-grow: 1; background: white; border: 1px solid #d8dfea; padding: 15px; min-height: 500px; }
        .content-header { border-bottom: 1px solid #d8dfea; padding-bottom: 5px; margin-bottom: 15px; color: #3b5998; font-size: 14px; font-weight: bold; }

        /* THE PLAYER FIXES */
        .video-box { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #3b5998; background: #000; }
        
        /* Shifting the video slightly less so the bottom controls are fully in view */
        #player { position: absolute; top: -45px; left: 0; width: 100%; height: calc(100% + 45px); }
        
        /* SHIELD FIX: Now only covers the top 75%. The bottom 25% (controls) is clickable! */
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 75%; z-index: 100; cursor: default; }

        .player-settings { margin-top: 15px; padding: 8px; background: #f2f2f2; border: 1px solid #ccc; display: flex; align-items: center; gap: 10px; font-weight: bold; color: #666; }
        select { font-size: 10px; border: 1px solid #bdc7d8; }
        .footer { text-align: center; margin: 30px 0; color: #888; font-size: 9px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>thephysicsportal</h1>
        <div style="margin-bottom:2px;">home search browse</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="side-box">
                <div class="side-header">My Courses</div>
                <div class="nav-link active" onclick="loadVideo('6tLJsEfbVcY', this)">Test Lesson</div>
                <div class="nav-link" onclick="loadVideo('GzY_iOnP3E8', this)">Lesson 1.1</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header" id="current-title">Test Lesson</div>
            
            <div class="video-box">
                <div id="player"></div>
                <div class="shield" oncontextmenu="return false;"></div>
            </div>

            <div class="player-settings">
                PLAYBACK SPEED:
                <select id="speed" onchange="player.setPlaybackRate(parseFloat(this.value))">
                    <option value="1" selected>1.0x (Normal)</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
                <span style="margin-left: 20px; color:#999; font-weight:normal;">[ Use bottom bar for Timeline / Fullscreen ]</span>
            </div>
        </div>
    </div>

    <div class="footer">thephysicsportal &copy; 2026</div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '6tLJsEfbVcY',
                playerVars: { 'modestbranding': 1, 'rel': 0, 'controls': 1, 'disablekb': 0 }
            });
        }
        function loadVideo(id, el) {
            player.loadVideoById(id);
            document.getElementById('current-title').innerText = el.innerText;
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
