<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal v1.2</title>
    <style>
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; justify-content: space-between; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 950px; margin: 20px auto; gap: 15px; }
        .sidebar { width: 150px; flex-shrink: 0; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; padding: 5px; }
        .side-header { background-color: #eceff5; padding: 3px 5px; color: #3b5998; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 3px 5px; cursor: pointer; }
        .nav-link.active { background-color: #3b5998; color: white; }
        .main-content { flex-grow: 1; background: white; border: 1px solid #d8dfea; padding: 15px; }

        .video-engine { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16/9; overflow: hidden; background: #000; border: 1px solid #3b5998; margin: 0 auto; }
        #player { position: absolute; top: -55px; left: 0; width: 100%; height: calc(100% + 110px); pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 80%; z-index: 100; }

        /* TIMELINE WITH TIMESTAMP */
        .timeline-wrapper { width: 100%; max-width: 640px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; }
        .timeline-container { flex-grow: 1; background: #eee; height: 10px; cursor: pointer; border: 1px solid #ccc; position: relative; }
        .progress-bar { background: #3b5998; height: 100%; width: 0%; transition: width 0.1s linear; }
        #time-display { font-family: monospace; color: #666; font-size: 10px; min-width: 70px; text-align: right; }

        .custom-controls { margin: 5px auto 0; max-width: 640px; background: #eceff5; border: 1px solid #d8dfea; padding: 10px; display: flex; align-items: center; gap: 12px; }
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 3px 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        select, input { font-size: 10px; border: 1px solid #bdc7d8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>thephysicsportal <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">v1.2</span></h1>
        <div style="font-size: 11px;">home | search | browse</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="side-box">
                <div class="side-header">Unit 1</div>
                <div class="nav-link active" onclick="loadNewVideo('6tLJsEfbVcY', this)">Test Lesson</div>
                <div class="nav-link" onclick="loadNewVideo('GzY_iOnP3E8', this)">Lesson 1.1</div>
            </div>
        </div>

        <div class="main-content">
            <div class="video-engine">
                <div id="player"></div>
                <div class="shield" oncontextmenu="return false;"></div>
            </div>

            <div class="timeline-wrapper">
                <div class="timeline-container" id="timeline" onclick="seek(event)">
                    <div class="progress-bar" id="progress"></div>
                </div>
                <div id="time-display">0:00 / 0:00</div>
            </div>

            <div class="custom-controls">
                <button class="fb-button" onclick="playPause()">PLAY / PAUSE</button>
                <span>SPD: 
                    <select onchange="setSpeed(this.value)">
                        <option value="1">1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </span>
                <span>VOL: <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)" style="width:60px;"></span>
                <button class="fb-button" onclick="goFullscreen()" style="margin-left:auto;">FULLSCREEN</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '6tLJsEfbVcY',
                playerVars: { 'controls': 1, 'modestbranding': 1, 'rel': 0, 'vq': 'small' },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == 1) {
                progressInterval = setInterval(updateUI, 500);
            } else {
                clearInterval(progressInterval);
            }
        }

        function formatTime(time) {
            var mins = Math.floor(time / 60);
            var secs = Math.floor(time % 60);
            if (secs < 10) secs = '0' + secs;
            return mins + ":" + secs;
        }

        function updateUI() {
            var curr = player.getCurrentTime();
            var dur = player.getDuration();
            if (dur > 0) {
                var perc = (curr / dur) * 100;
                document.getElementById('progress').style.width = perc + "%";
                document.getElementById('time-display').innerText = formatTime(curr) + " / " + formatTime(dur);
            }
        }

        function seek(e) {
            var rect = document.getElementById('timeline').getBoundingClientRect();
            player.seekTo(player.getDuration() * ((e.clientX - rect.left) / rect.width), true);
        }

        function playPause() { (player.getPlayerState() == 1) ? player.pauseVideo() : player.playVideo(); }
        function setSpeed(v) { player.setPlaybackRate(parseFloat(v)); }
        function setVolume(v) { player.setVolume(v); }
        function goFullscreen() {
            var el = document.querySelector('.video-engine');
            if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        function loadNewVideo(id, el) {
            player.loadVideoById(id);
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
