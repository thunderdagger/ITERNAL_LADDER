<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal v3.1.8</title>
    <style>
        /* FB THEME & LAYOUT */
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; overflow-x: hidden; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; justify-content: space-between; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 1100px; margin: 20px auto; gap: 15px; }
        
        /* SIDEBAR */
        .sidebar { width: 230px; flex-shrink: 0; max-height: 85vh; overflow-y: auto; user-select: none; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; }
        .subject-header { background: #eceff5; padding: 8px 10px; color: #3b5998; font-weight: bold; border-bottom: 1px solid #d8dfea; font-size: 12px; }
        .batch-group { padding: 5px 0 5px 10px; border-bottom: 1px solid #f0f0f0; }
        .batch-title { font-weight: bold; color: #666; font-size: 10px; text-transform: uppercase; }
        .unit-group { padding-left: 10px; margin-top: 5px; }
        .unit-title { color: #3b5998; font-style: italic; margin-bottom: 3px; font-weight: bold; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 4px 5px 4px 15px; cursor: pointer; border-left: 2px solid transparent; }
        .nav-link:hover { background-color: #eff2f7; text-decoration: underline; }
        .nav-link.active { background-color: #3b5998; color: white; font-weight: bold; border-left: 2px solid #29487d; }

        /* PLAYER ENGINE */
        #master-player-wrapper { position: relative; background: #fff; flex-grow: 1; border: 1px solid #d8dfea; display: flex; flex-direction: column; outline: none; overflow: hidden; }
        .video-title-bar { background: #eceff5; border-bottom: 1px solid #d8dfea; padding: 10px 12px; z-index: 100; transition: 0.4s ease; }
        .video-title-bar h2 { margin: 0; font-size: 13px; color: #3b5998; font-weight: bold; }
        .video-engine { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; z-index: 1; }
        #player { position: absolute; top: -55px; left: 0; width: 100%; height: calc(100% + 110px); pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }
        
        /* CONTROLS */
        .floating-ui { background: #eceff5; border-top: 1px solid #3b5998; padding: 10px; z-index: 100; transition: 0.4s ease; }
        #master-player-wrapper:fullscreen .video-title-bar { position: absolute; top: 0; width: 100%; background: rgba(236,239,245,0.9); }
        #master-player-wrapper:fullscreen .floating-ui { position: absolute; bottom: 0; width: 100%; background: rgba(236,239,245,0.9); box-sizing: border-box; }
        .hide-ui { cursor: none !important; }
        .hide-ui .video-title-bar { transform: translateY(-100%); opacity: 0; }
        .hide-ui .floating-ui { transform: translateY(100%); opacity: 0; }
        
        /* TIMELINE WITH BUFFER */
        .timeline-container { flex-grow: 1; background: #ccc; height: 10px; cursor: pointer; border: 1px solid #999; position: relative; overflow: hidden; margin-bottom: 8px; }
        .buffer-bar { position: absolute; background: #aaa; height: 100%; width: 0%; z-index: 1; transition: width 0.3s ease; }
        .progress-bar { position: absolute; background: #3b5998; height: 100%; width: 0%; z-index: 2; }
        
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .speed-control { font-size: 10px; font-weight: bold; color: #3b5998; margin: 0 10px; }
        .speed-select { font-size: 10px; border: 1px solid #bdc7d8; padding: 2px; background: #fff; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header"><h1>thephysicsportal <span style="font-weight:normal; font-size:10px;">v3.1.8</span></h1></div>

    <div class="container">
        <div class="sidebar" id="main-sidebar">Initializing system...</div>
        
        <div id="master-player-wrapper" tabindex="0">
            <div class="video-title-bar"><h2 id="current-video-title">Select Lesson</h2></div>
            <div class="video-engine">
                <div id="player"></div>
                <div class="shield"></div>
            </div>
            <div class="floating-ui">
                <div class="timeline-container" onclick="seek(event)">
                    <div class="buffer-bar" id="buffer"></div>
                    <div class="progress-bar" id="progress"></div>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="fb-button" onclick="playPause()">PLAY / PAUSE</button>
                    
                    <div class="speed-control">
                        SPEED: 
                        <select id="video-speed" class="speed-select" onchange="setSpeed(this.value)">
                            <option value="1">1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="1.75">1.75x</option>
                            <option value="2">2.0x</option>
                        </select>
                    </div>

                    <span id="time-display" style="font-family:monospace; font-size:11px;">00:00:00 / 00:00:00</span>
                    <button class="fb-button" onclick="goFullscreen()" style="margin-left:auto;">FULL SCREEN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player, idleTimer, portalData, currentSpeed = 1;
        const wrapper = document.getElementById('master-player-wrapper');

        fetch('system.bin')
            .then(res => res.text())
            .then(scrambled => {
                const decoded = decodeURIComponent(escape(atob(scrambled)));
                portalData = JSON.parse(decoded);
                buildSidebar();
            })
            .catch(err => { document.getElementById('main-sidebar').innerText = "System Error."; });

        function buildSidebar() {
            const sb = document.getElementById('main-sidebar');
            let h = '';
            portalData.forEach(subject => {
                h += `<div class="side-box"><div class="subject-header">${subject.s}</div>`;
                subject.b.forEach(batch => {
                    h += `<div class="batch-group"><div class="batch-title">${batch.y}</div>`;
                    batch.u.forEach(unit => {
                        h += `<div class="unit-group"><div class="unit-title">${unit.n}</div>`;
                        unit.v.forEach(video => {
                            h += `<div class="nav-link" onclick="handleSwitch('${video.i}', this)">${video.t}</div>`;
                        });
                        h += `</div>`;
                    });
                    h += `</div>`;
                });
                h += `</div>`;
            });
            sb.innerHTML = h;
        }

        function handleSwitch(id, el) { 
            player.loadVideoById(id);
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
            wrapper.focus();
            setTimeout(() => player.setPlaybackRate(parseFloat(currentSpeed)), 1000);
        }

        function onYouTubeIframeAPIReady() {
            const waiter = setInterval(() => {
                if(portalData) {
                    clearInterval(waiter);
                    player = new YT.Player('player', {
                        videoId: portalData[0].b[0].u[0].v[0].i,
                        playerVars: { 'controls': 0, 'modestbranding': 1, 'rel': 0 },
                        events: { 
                            'onStateChange': (e) => { 
                                if(e.data == 1) { startIdleTimer(); player.setPlaybackRate(parseFloat(currentSpeed)); } 
                                else { showUI(); }
                                updateTitle(); 
                            }, 
                            'onReady': updateTitle 
                        }
                    });
                }
            }, 100);
            setInterval(updateUI, 500);
        }

        function setSpeed(val) {
            currentSpeed = val;
            if(player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(val));
        }

        // UPDATED UI TO SHOW BUFFER
        function updateUI() { 
            if(player && player.getDuration) { 
                var c = player.getCurrentTime(), 
                    d = player.getDuration(),
                    b = player.getVideoLoadedFraction(); // Gets buffer %
                
                document.getElementById('progress').style.width = (c/d*100) + "%";
                document.getElementById('buffer').style.width = (b*100) + "%"; // Updates buffer bar
                document.getElementById('time-display').innerText = formatTime(c) + " / " + formatTime(d); 
            } 
        }

        function formatTime(t) { var h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=Math.floor(t%60); return (h<10?'0'+h:h)+":"+(m<10?'0'+m:m)+":"+(s<10?'0'+s:s); }
        function updateTitle() { try { document.getElementById('current-video-title').innerText = player.getVideoData().title; } catch(e){} }
        function playPause() { (player.getPlayerState()==1)?player.pauseVideo():player.playVideo(); }
        function goFullscreen() { if(!document.fullscreenElement) wrapper.requestFullscreen(); else document.exitFullscreen(); }
        function seek(e) { var r = e.currentTarget.getBoundingClientRect(); player.seekTo(player.getDuration()*((e.clientX-r.left)/r.width), true); }
        function startIdleTimer() { showUI(); clearTimeout(idleTimer); if (document.fullscreenElement) idleTimer = setTimeout(() => wrapper.classList.add('hide-ui'), 3000); }
        function showUI() { wrapper.classList.remove('hide-ui'); }
        
        wrapper.addEventListener('mousemove', startIdleTimer);
        wrapper.addEventListener('keydown', (e) => { 
            if(e.code==="Space"){e.preventDefault(); playPause();} 
            if(e.code==="KeyF") goFullscreen(); 
            if(e.code==="ArrowRight") player.seekTo(player.getCurrentTime() + 5, true);
            if(e.code==="ArrowLeft") player.seekTo(player.getCurrentTime() - 5, true);
            startIdleTimer(); 
        });
    </script>
</body>
</html>
