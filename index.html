<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>thephysicsportal v2.3.1</title>
    <style>
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; justify-content: space-between; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 950px; margin: 20px auto; gap: 15px; }
        
        .sidebar { width: 150px; flex-shrink: 0; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 10px; padding: 5px; }
        .side-header { background-color: #eceff5; padding: 3px 5px; color: #3b5998; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 3px 5px; cursor: pointer; }
        .nav-link.active { background-color: #3b5998; color: white; }

        #master-player-wrapper { position: relative; background: #fff; flex-grow: 1; border: 1px solid #d8dfea; display: flex; flex-direction: column; outline: none; }
        
        .video-title-bar { background: #eceff5; border-bottom: 1px solid #d8dfea; padding: 8px 12px; z-index: 11; transition: transform 0.4s ease, opacity 0.4s ease; }
        .video-title-bar h2 { margin: 0; font-size: 13px; color: #3b5998; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .video-engine { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; z-index: 1; }
        #player { position: absolute; top: -55px; left: 0; width: 100%; height: calc(100% + 110px); pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 80%; z-index: 2; }

        .floating-ui { background: #eceff5; border-top: 1px solid #3b5998; padding: 10px; z-index: 10; transition: transform 0.4s ease, opacity 0.4s ease; }

        /* FULLSCREEN */
        #master-player-wrapper:fullscreen { background: #000; border: none; width: 100vw; height: 100vh; justify-content: center; }
        #master-player-wrapper:fullscreen .video-title-bar { position: absolute; top: 0; left: 0; right: 0; background: rgba(236, 239, 245, 0.92); border-bottom: 1px solid #3b5998; }
        #master-player-wrapper:fullscreen .floating-ui { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(236, 239, 245, 0.92); }
        #master-player-wrapper:fullscreen.hide-ui { cursor: none; }
        #master-player-wrapper:fullscreen.hide-ui .floating-ui { transform: translateY(100%); opacity: 0; }
        #master-player-wrapper:fullscreen.hide-ui .video-title-bar { transform: translateY(-100%); opacity: 0; }

        /* TIMELINE */
        .timeline-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .timeline-container { flex-grow: 1; background: #ccc; height: 10px; cursor: pointer; border: 1px solid #999; position: relative; overflow: hidden; }
        .buffer-bar { position: absolute; background: #bbb; height: 100%; width: 0%; z-index: 1; transition: width 0.3s ease; }
        .progress-bar { position: absolute; background: #3b5998; height: 100%; width: 0%; z-index: 2; transition: width 0.1s linear; }
        #time-display { font-family: monospace; color: #333; font-size: 11px; min-width: 120px; text-align: right; }

        /* CONTROLS AREA */
        .custom-controls { display: flex; align-items: center; gap: 12px; }
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer; }
        
        /* THE SHORTCUTS TEXT (Moved from sidebar) */
        .shortcut-hint { color: #888; font-size: 9px; line-height: 1; margin-left: 10px; border-left: 1px solid #bdc7d8; padding-left: 10px; }

        input[type=range] { -webkit-appearance: none; width: 60px; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 5px; cursor: pointer; background: #bdc7d8; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { height: 12px; width: 12px; border-radius: 6px; background: #3b5998; cursor: pointer; -webkit-appearance: none; margin-top: -3.5px; }
        select { font-size: 10px; border: 1px solid #bdc7d8; padding: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>thephysicsportal <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">v2.3.1</span></h1>
        <div style="font-size: 11px;">home | search | browse</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="side-box">
                <div class="side-header">Physics Units</div>
                <div class="nav-link active" onclick="loadNewVideo('6tLJsEfbVcY', this)">Test Lesson</div>
                <div class="nav-link" onclick="loadNewVideo('GzY_iOnP3E8', this)">Lesson 1.1</div>
            </div>
        </div>

        <div id="master-player-wrapper" tabindex="0">
            <div class="video-title-bar">
                <h2 id="current-video-title">Loading title...</h2>
            </div>

            <div class="video-engine">
                <div id="player"></div>
                <div class="shield" oncontextmenu="return false;"></div>
            </div>

            <div class="floating-ui" id="controls-bar">
                <div class="timeline-wrapper">
                    <div class="timeline-container" id="timeline" onclick="seek(event)">
                        <div class="buffer-bar" id="buffer"></div>
                        <div class="progress-bar" id="progress"></div>
                    </div>
                    <div id="time-display">00:00:00 / 00:00:00</div>
                </div>

                <div class="custom-controls">
                    <button class="fb-button" onclick="playPause()">PLAY / PAUSE</button>
                    <span>SPD: 
                        <select onchange="setSpeed(this.value)">
                            <option value="1">1x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </span>
                    <span style="font-weight:bold; color:#3b5998; font-size:10px;">VOL: <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)"></span>
                    
                    <div class="shortcut-hint">
                        SPACE: PLAY/PAUSE • ARROWS: SEEK • F: FULLSCREEN
                    </div>

                    <button class="fb-button" onclick="goFullscreen()" style="margin-left:auto;">FULL SCREEN</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var progressInterval;
        var idleTimer;
        const wrapper = document.getElementById('master-player-wrapper');

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '6tLJsEfbVcY',
                playerVars: { 'controls': 1, 'modestbranding': 1, 'rel': 0, 'vq': 'small' },
                events: { 'onStateChange': onPlayerStateChange, 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady() { updateAutoTitle(); wrapper.focus(); }

        function updateAutoTitle() {
            try {
                var videoData = player.getVideoData();
                if (videoData && videoData.title) { document.getElementById('current-video-title').innerText = videoData.title; }
            } catch (e) {}
        }

        wrapper.addEventListener('keydown', function(e) {
            if (e.code === "Space") { e.preventDefault(); playPause(); }
            if (e.code === "ArrowRight") { player.seekTo(player.getCurrentTime() + 5, true); }
            if (e.code === "ArrowLeft") { player.seekTo(player.getCurrentTime() - 5, true); }
            if (e.code === "KeyF") { goFullscreen(); }
        });

        function resetIdleTimer() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            wrapper.classList.remove('hide-ui');
            clearTimeout(idleTimer);
            if (isFullscreen && player.getPlayerState() === 1) {
                idleTimer = setTimeout(() => { wrapper.classList.add('hide-ui'); }, 3000);
            }
        }

        wrapper.addEventListener('mousemove', resetIdleTimer);

        function onPlayerStateChange(event) {
            if (event.data == 1 || event.data == -1) { updateAutoTitle(); }
            if (event.data == 1) {
                progressInterval = setInterval(updateUI, 500);
                resetIdleTimer();
            } else {
                clearInterval(progressInterval);
                wrapper.classList.remove('hide-ui'); 
                clearTimeout(idleTimer);
            }
        }

        function formatTime(time) {
            var hours = Math.floor(time / 3600);
            var mins = Math.floor((time % 3600) / 60);
            var secs = Math.floor(time % 60);
            return (hours < 10 ? '0' + hours : hours) + ":" + (mins < 10 ? '0' + mins : mins) + ":" + (secs < 10 ? '0' + secs : secs);
        }

        function updateUI() {
            var curr = player.getCurrentTime();
            var dur = player.getDuration();
            var buffered = player.getVideoLoadedFraction();
            if (dur > 0) {
                document.getElementById('progress').style.width = (curr / dur * 100) + "%";
                document.getElementById('buffer').style.width = (buffered * 100) + "%";
                document.getElementById('time-display').innerText = formatTime(curr) + " / " + formatTime(dur);
            }
        }

        function seek(e) {
            var rect = document.getElementById('timeline').getBoundingClientRect();
            player.seekTo(player.getDuration() * ((e.clientX - rect.left) / rect.width), true);
        }

        function playPause() { (player.getPlayerState() == 1) ? player.pauseVideo() : player.playVideo(); }
        function setSpeed(v) { player.setPlaybackRate(parseFloat(v)); }
        function setVolume(v) { player.setVolume(v); }

        function goFullscreen() {
            var el = document.getElementById('master-player-wrapper');
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) { el.requestFullscreen(); }
                else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
            } else { document.exitFullscreen(); }
        }

        function loadNewVideo(id, el) {
            player.loadVideoById(id);
            document.getElementById('current-video-title').innerText = "Loading title...";
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
            wrapper.focus();
        }
    </script>
</body>
</html>
