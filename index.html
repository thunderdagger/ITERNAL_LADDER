<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>theetarnalraven v4.0.1</title>
    <style>
        /* CORE THEME */
        body { background-color: #f7f7f7; color: #333; font-family: "lucida grande", tahoma, verdana, arial, sans-serif; margin: 0; padding: 0; font-size: 11px; overflow-x: hidden; }
        .header { background-color: #3b5998; padding: 8px 15px; color: white; border-bottom: 1px solid #29487d; display: flex; align-items: flex-end; justify-content: space-between; }
        .header h1 { font-size: 18px; margin: 0; letter-spacing: -1px; font-weight: bold; }
        .container { display: flex; max-width: 1150px; margin: 20px auto; gap: 15px; padding: 0 10px; }
        
        /* SIDEBAR ACCORDION */
        .sidebar { width: 250px; flex-shrink: 0; max-height: 85vh; overflow-y: auto; user-select: none; }
        .side-box { background: white; border: 1px solid #d8dfea; margin-bottom: 5px; border-radius: 2px; overflow: hidden; }
        .subject-header { background: #eceff5; padding: 10px; color: #3b5998; font-weight: bold; border-bottom: 1px solid #d8dfea; font-size: 12px; cursor: pointer; }
        .batch-content { display: none; background: #fff; }
        .batch-content.open { display: block; }
        .batch-group { border-bottom: 1px solid #f0f0f0; }
        .batch-title { padding: 8px 10px; font-weight: bold; color: #666; font-size: 10px; text-transform: uppercase; cursor: pointer; background: #fafafa; }
        .unit-content { display: none; padding-bottom: 5px; }
        .unit-content.open { display: block; }
        .unit-title { padding: 5px 20px; color: #3b5998; font-style: italic; font-weight: bold; font-size: 10px; cursor: pointer; border-left: 3px solid #d8dfea; }
        .nav-link { display: block; color: #3b5998; text-decoration: none; padding: 4px 5px 4px 35px; cursor: pointer; border-left: 2px solid transparent; }
        .nav-link:hover { background-color: #eff2f7; text-decoration: underline; }
        .nav-link.active { background-color: #3b5998; color: white !important; font-weight: bold; border-left: 2px solid #29487d; }

        /* PLAYER ENGINE & DYNAMIC TITLE BAR */
        #master-player-wrapper { position: relative; background: #fff; flex-grow: 1; border: 1px solid #d8dfea; display: flex; flex-direction: column; outline: none; overflow: hidden; }
        
        /* Updated Title Bar to match your screenshot style */
        .video-title-bar { background: #eceff5; border-bottom: 1px solid #d8dfea; padding: 8px 12px; z-index: 100; transition: 0.4s ease; min-height: 16px; }
        .video-title-bar h2 { margin: 0; font-size: 13px; color: #3b5998; font-weight: bold; display: inline-block; }
        
        .video-engine { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; z-index: 1; }
        #player { position: absolute; top: -55px; left: 0; width: 100%; height: calc(100% + 110px); pointer-events: none; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }
        
        #landing-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; color: white; text-align: center; }
        .portal-logo { font-size: 36px; font-weight: bold; letter-spacing: -2px; color: #3b5998; margin-bottom: 5px; }
        .hidden { display: none !important; }

        /* CONTROLS */
        .floating-ui { background: #eceff5; border-top: 1px solid #3b5998; padding: 10px; z-index: 100; transition: 0.4s ease; }
        .timeline-container { flex-grow: 1; background: #ccc; height: 10px; cursor: pointer; border: 1px solid #999; position: relative; overflow: hidden; margin-bottom: 8px; }
        .buffer-bar { position: absolute; background: #aaa; height: 100%; width: 0%; z-index: 1; transition: width 0.3s ease; }
        .progress-bar { position: absolute; background: #3b5998; height: 100%; width: 0%; z-index: 2; }
        .fb-button { background: #3b5998; color: white; border: 1px solid #29487d; padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .speed-select { font-size: 10px; border: 1px solid #bdc7d8; padding: 2px; background: #fff; }
    </style>
</head>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player, idleTimer, portalData, currentSpeed = 1, isLanding = true;
        const wrapper = document.getElementById('master-player-wrapper');

        fetch('system.bin').then(res => res.text()).then(scrambled => {
            const decoded = decodeURIComponent(escape(atob(scrambled)));
            portalData = JSON.parse(decoded);
            buildSidebar();
        });

        function buildSidebar() {
            const sb = document.getElementById('main-sidebar');
            let h = '';
            portalData.forEach((subject, sIdx) => {
                h += `<div class="side-box"><div class="subject-header" onclick="toggle('sub-${sIdx}')">${subject.s}</div><div class="batch-content" id="sub-${sIdx}">`;
                subject.b.forEach((batch, bIdx) => {
                    h += `<div class="batch-group"><div class="batch-title" onclick="toggle('bat-${sIdx}-${bIdx}')">${batch.y}</div><div class="unit-content" id="bat-${sIdx}-${bIdx}">`;
                    batch.u.forEach((unit, uIdx) => {
                        h += `<div class="unit-title" onclick="toggle('uni-${sIdx}-${bIdx}-${uIdx}')">${unit.n}</div><div class="unit-content" id="uni-${sIdx}-${bIdx}-${uIdx}">`;
                        unit.v.forEach(video => {
                            h += `<div class="nav-link" onclick="handleSwitch('${video.i}', this)">${video.t}</div>`;
                        });
                        h += `</div>`;
                    });
                    h += `</div></div>`;
                });
                h += `</div></div>`;
            });
            sb.innerHTML = h;
        }

        function toggle(id) { document.getElementById(id).classList.toggle('open'); }

        function handleSwitch(id, el) { 
            isLanding = false;
            document.getElementById('landing-overlay').classList.add('hidden');
            player.loadVideoById(id);
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
            wrapper.focus();
            setTimeout(() => player.setPlaybackRate(parseFloat(currentSpeed)), 1000);
        }

        function onYouTubeIframeAPIReady() {
            const waiter = setInterval(() => {
                if(portalData) {
                    clearInterval(waiter);
                    player = new YT.Player('player', {
                        videoId: portalData[0].b[0].u[0].v[0].i,
                        playerVars: { 'controls': 0, 'modestbranding': 1, 'rel': 0 },
                        events: { 
                            'onStateChange': (e) => { 
                                if(e.data == 1) startIdleTimer(); 
                                updateTitle(); 
                            }, 
                            'onReady': updateTitle 
                        }
                    });
                }
            }, 100);
            setInterval(updateUI, 500);
        }
